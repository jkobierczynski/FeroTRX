[workspace]
resolver = "2"
members = [
    "crates/ferotrx-core",
    "crates/ferotrx-io",
    "crates/ferotrx-packet",
    "crates/ferotrx-ctl",
    "crates/ferotrx-cli",
    "crates/ferotrx-gui",
]

[workspace.package]
version = "0.37.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkobierczynski/FeroTRX"
rust-version = "1.88"

[workspace.dependencies]
ferotrx-core = { path = "crates/ferotrx-core", version = "0.37.0" }
ferotrx-packet = { path = "crates/ferotrx-packet", version = "0.37.0" }
ferotrx-ctl = { path = "crates/ferotrx-ctl", version = "0.37.0", default-features = false }
ferotrx-io = { path = "crates/ferotrx-io", version = "0.37.0", default-features = false }
pcap-file = "2.0"
pcap = "2.2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2.155"
cc = "1"
pkg-config = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.10", features = ["std"] }
ring = "0.17"
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
