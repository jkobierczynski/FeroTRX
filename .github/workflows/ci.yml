name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # macOS ships libpcap. Windows links against the Npcap SDK; running the
      # binary needs Npcap installed, so on Windows only the core and packet tests run.
      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$PWD\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Build without libpcap
        run: cargo build -p ferotrx-cli --no-default-features
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Test core (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p ferotrx-core -p ferotrx-packet
      # The control server tests need no interfaces, so they run without libpcap/Npcap.
      - name: Test control API (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p ferotrx-ctl --no-default-features

      # AF_XDP needs root and an interface it may send on: a veth pair.
      - name: AF_XDP on a veth pair (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ip link add xt0 type veth peer name xt1
          # No IPv6 on the pair: router solicitations and MLD reports sent after
          # link up would show in the tx counters the tests compare.
          sudo sysctl -qw net.ipv6.conf.xt0.disable_ipv6=1 net.ipv6.conf.xt1.disable_ipv6=1
          sudo ip link set xt0 up
          sudo ip link set xt1 up
          bin=$(cargo test -p ferotrx-io --lib --no-run --message-format=json \
                | jq -r 'select(.executable != null and .target.kind == ["lib"]) | .executable')
          sudo FEROTRX_TEST_XDP_IFACE=xt0 "$bin" af_xdp --nocapture
          cargo build -p ferotrx-cli
          before=$(cat /sys/class/net/xt1/statistics/rx_packets)
          sudo ./target/debug/ferotrx replay examples/web.pcap -i xt0 -B af_xdp --xdp-mode copy -t -l 100
          after=$(cat /sys/class/net/xt1/statistics/rx_packets)
          echo "xt1 received $((after - before)) packets"
          test $((after - before)) -ge 2100

      # Stateful TCP through a real NAT router: a network namespace with the
      # kernel's routing, conntrack and masquerading between two VLANs on a
      # trunk, as in a small lab. Then without VLANs, with 3% packet loss.
      - name: Stateful TCP through a NAT router (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo scripts/tcp-nat-netns.sh ./target/debug/ferotrx -n 300 --cps 100
          sudo NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -n 300 --cps 100

      # Several templates mixed by weight, from ten clients to four servers,
      # through the same NAT router: on the trunk, then with 3% loss.
      - name: Multi-flow TCP templates through a NAT router (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo MIX=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx
          sudo MIX=1 NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx

      # The same over IPv6: neighbor discovery between the router and the
      # emulated hosts instead of ARP, one session on the trunk, then the
      # template mix with 3% loss.
      - name: Stateful TCP over IPv6 through a router (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo IPV6=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -n 300 --cps 100
          sudo IPV6=1 MIX=1 NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx

      # Loss and latency through a router in a network namespace: routing and
      # masquerading, a 5 ms delay (netem), then 3% packet loss on top.
      - name: Loss and latency through a router (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe sch_netem || true
          sudo scripts/latency-netns.sh ./target/debug/ferotrx
          sudo LOSS=0.03 scripts/latency-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/latency-netns.sh ./target/debug/ferotrx

  # DPDK is an optional feature: build it against Ubuntu's DPDK and send
  # through DPDK's af_packet driver on a veth pair, without hugepages.
  dpdk:
    name: dpdk (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install DPDK and libpcap
        run: sudo apt-get update && sudo apt-get install -y dpdk-dev libpcap-dev pkg-config
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features ferotrx-cli/dpdk -- -D warnings
      - name: Build
        run: cargo build -p ferotrx-cli --features dpdk
      - name: Send through DPDK
        run: |
          sudo ip link add dt0 type veth peer name dt1
          # No IPv6 on the pair: router solicitations and MLD reports sent after
          # link up would show in the tx counters the tests compare.
          sudo sysctl -qw net.ipv6.conf.dt0.disable_ipv6=1 net.ipv6.conf.dt1.disable_ipv6=1
          sudo ip link set dt0 up
          sudo ip link set dt1 up
          eal='--no-huge -m 256 --no-pci -l 0 --log-level=warning'
          ./target/debug/ferotrx backends | grep -q '^yes  dpdk'
          before=$(cat /sys/class/net/dt1/statistics/rx_packets)
          sudo ./target/debug/ferotrx replay examples/web.pcap -i net_af_packet0,iface=dt0 \
            -B dpdk --dpdk-args "$eal" -t -l 100
          after=$(cat /sys/class/net/dt1/statistics/rx_packets)
          echo "dt1 received $((after - before)) packets"
          test $((after - before)) -ge 2100
          sudo ./target/debug/ferotrx replay examples/web.pcap -i net_null0 \
            -B dpdk --dpdk-args "$eal" --pps 2000 -l 5
