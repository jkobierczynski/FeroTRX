name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every job even when an equivalent tree already passed
        type: boolean
        default: true

# A new push to a pull request cancels the run still going for the old one.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token can read the repository and nothing else; a job that needs more
# asks for it. Every action is pinned to a commit (the comment names its
# version); Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # scripts/ci-gate.sh looks up earlier runs' artifacts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Parents and grandparents too: scripts/ci-gate.sh compares their trees.
          fetch-depth: 3
      # Skips the remaining steps when this job already passed on the same
      # tree, or on one that differs only in docs or version numbers. The
      # job itself still runs, so its required check still reports.
      - name: Skip if an equivalent tree already passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FORCE: ${{ inputs.full == true }}
        run: scripts/ci-gate.sh ${{ matrix.os }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.CI_SKIP != 'true'
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.CI_SKIP != 'true'

      - name: Install libpcap (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        # tshark checks what the packet builder makes (crates/ferotrx-packet/tests/wireshark.rs).
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libpcap-dev tshark

      # macOS ships libpcap. Windows links against the Npcap SDK; running the
      # binary needs Npcap installed, so on Windows only the core and packet tests run.
      - name: Install Npcap SDK (Windows)
        if: env.CI_SKIP != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$PWD\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Format
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: env.CI_SKIP != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        if: env.CI_SKIP != 'true'
        run: cargo build --workspace
      - name: Build without libpcap
        if: env.CI_SKIP != 'true'
        run: cargo build -p ferotrx-cli --no-default-features
      - name: Test
        if: env.CI_SKIP != 'true' && runner.os != 'Windows'
        run: cargo test --workspace
        env:
          FEROTRX_REQUIRE_TSHARK: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Test core (Windows)
        if: env.CI_SKIP != 'true' && runner.os == 'Windows'
        run: cargo test -p ferotrx-core -p ferotrx-packet -p ferotrx-gui
      # The control server tests need no interfaces, so they run without libpcap/Npcap.
      - name: Test control API (Windows)
        if: env.CI_SKIP != 'true' && runner.os == 'Windows'
        run: cargo test -p ferotrx-ctl --no-default-features

      # The installer: build it from this build, install it silently, check
      # what it put where (programs, examples, docs, PATH, *.ferotrx, Start
      # menu), run ferotrx.exe from it, and uninstall. The runner has no
      # Npcap: ferotrx.exe must still start (wpcap.dll is loaded late) and say
      # what is missing when asked for interfaces.
      - name: Windows installer (MSI)
        if: env.CI_SKIP != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p ferotrx-cli -p ferotrx-gui
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          # The GUI's own server ("This computer"), now that ferotrx.exe is built.
          cargo test -p ferotrx-gui --test local -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "the GUI's local server test failed" }
          packaging\windows\build-msi.ps1 -BinDir target\debug -Out dist
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 80; throw "install failed: $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\FeroTRX"
          foreach ($f in 'ferotrx.exe', 'ferotrx-gui.exe', 'README.md', 'LICENSE.txt', 'examples\http.pcap', 'examples\lab-tcp.toml', 'docs\gui.md') {
            if (-not (Test-Path "$dir\$f")) { throw "the installer left out $f" }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\FeroTRX.lnk")) { throw "no Start menu entry" }
          if ([Environment]::GetEnvironmentVariable('PATH', 'Machine') -notlike "*$dir*") { throw "$dir is not on the PATH" }
          $open = (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\FeroTRX.Workspace\shell\open\command').'(default)'
          if ($open -notlike '*ferotrx-gui.exe*%1*') { throw "*.ferotrx opens with: $open" }
          & "$dir\ferotrx.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "ferotrx.exe --version failed" }
          & "$dir\ferotrx.exe" run examples\lab-built-packets.toml --null --duration 1s
          if ($LASTEXITCODE -ne 0) { throw "ferotrx.exe run --null failed" }
          # The Windows service: install it from the installed ferotrx.exe, log
          # in through it, check the token is not on its command line, remove it.
          & "$dir\ferotrx.exe" service install -- --token ci-secret
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:ProgramData\FeroTRX\service.log" -ErrorAction SilentlyContinue; throw "service install failed" }
          & "$dir\ferotrx.exe" service status
          $env:FEROTRX_TOKEN = 'ci-secret'
          & "$dir\ferotrx.exe" ctl info
          if ($LASTEXITCODE -ne 0) { throw "ferotrx ctl info through the service failed" }
          # Runs through the service on the ports that need no Npcap: null, and
          # file (a pcap written in the service's data directory).
          Copy-Item examples\lab-built-packets.toml "$env:ProgramData\FeroTRX\data\"
          & "$dir\ferotrx.exe" ctl load lab-built-packets.toml
          if ($LASTEXITCODE -ne 0) { throw "ctl load through the service failed" }
          & "$dir\ferotrx.exe" ctl start lab-built-packets --null --duration 1s --watch
          if ($LASTEXITCODE -ne 0) { throw "a null run through the service failed" }
          & "$dir\ferotrx.exe" ctl start lab-built-packets --out service-out.pcap --duration 1s --watch
          if ($LASTEXITCODE -ne 0) { throw "a file run through the service failed" }
          if ((Get-Item "$env:ProgramData\FeroTRX\data\service-out.pcap").Length -le 24) { throw "the file port wrote no packets" }
          Remove-Item Env:FEROTRX_TOKEN
          $image = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\FeroTRX').ImagePath
          Write-Host "service command: $image"
          if ($image -like '*ci-secret*') { throw "the token is on the service's command line" }
          & "$dir\ferotrx.exe" service remove
          if ($LASTEXITCODE -ne 0) { throw "service remove failed" }
          if (Get-Service FeroTRX -ErrorAction SilentlyContinue) { throw "the service is still there" }
          # Installed again (not started): the uninstaller must remove it.
          & "$dir\ferotrx.exe" service install --manual --no-start
          if ($LASTEXITCODE -ne 0) { throw "second service install failed" }
          if (-not (Test-Path "$env:SystemRoot\System32\Npcap\wpcap.dll") -and -not (Test-Path "$env:SystemRoot\System32\wpcap.dll")) {
            # This call is meant to fail: don't let its exit code end the step.
            $PSNativeCommandUseErrorActionPreference = $false
            $ErrorActionPreference = 'Continue'
            $out = & "$dir\ferotrx.exe" interfaces 2>&1 | Out-String
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            Write-Host $out
            if ($code -eq 0 -or $out -notmatch 'Npcap is not installed') { throw "ferotrx interfaces without Npcap: $out" }
          }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$dir\ferotrx.exe") { throw "the uninstaller left ferotrx.exe" }
          if (Get-Service FeroTRX -ErrorAction SilentlyContinue) { throw "the uninstaller left the service" }
          # The runner ends the step with the last native exit code, which is
          # the expected failure of `ferotrx interfaces` above.
          exit 0

      # The GUI opens a window, connects to a server and keeps running: on a
      # virtual X display with Mesa's software OpenGL. `timeout` ending it
      # (exit 124) is the pass; anything earlier is a crash.
      - name: GUI smoke test (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libgl1-mesa-dri libegl1
          cargo build -p ferotrx-cli -p ferotrx-gui
          ./target/debug/ferotrx serve -l 127.0.0.1:4519 > "$RUNNER_TEMP/gui-serve.log" 2>&1 &
          serve=$!
          status=0
          XDG_DATA_HOME="$RUNNER_TEMP/gui-data" timeout 15 xvfb-run -a \
            ./target/debug/ferotrx-gui --connect 127.0.0.1:4519 --port null \
            --profile examples/lab-built-packets.toml examples/web.pcap || status=$?
          kill "$serve" || true
          if [ "$status" != 124 ]; then
            echo "::error::ferotrx-gui exited with $status before the timeout"
            exit 1
          fi

      # The Python client (python/) against real `ferotrx serve` processes:
      # tokens, roles, TLS and client certificates, every method family,
      # blocking and asyncio. Windows runs the server built without libpcap.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.CI_SKIP != 'true'
        with:
          python-version: "3.12"
      - name: Python client
        if: env.CI_SKIP != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build -p ferotrx-cli --no-default-features
          else
            cargo build -p ferotrx-cli
          fi
          python -m pip install -e './python[dev]'
          cd python
          mypy
          ruff check .
          ruff format --check .
          FEROTRX_REQUIRE_SERVER=1 python -m pytest -v

      # The Python client's lab tests: TCP sessions, DNS transactions and a
      # stream with a receiver across a veth pair, through a root server.
      - name: Python client on a veth pair (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo ip link add pt0 type veth peer name pt1
          sudo sysctl -qw net.ipv6.conf.pt0.disable_ipv6=1 net.ipv6.conf.pt1.disable_ipv6=1
          sudo ip link set pt0 up
          sudo ip link set pt1 up
          sudo ./target/debug/ferotrx serve -l 127.0.0.1:4511 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 100); do
            grep -q "control server on" "$RUNNER_TEMP/serve.log" && break
            sleep 0.1
          done
          cat "$RUNNER_TEMP/serve.log"
          status=0
          FEROTRX_TEST_LAB=127.0.0.1:4511 FEROTRX_TEST_IFACES=pt0,pt1 \
            python -m pytest -v -m lab python/tests || status=$?
          sudo pkill -f 'ferotrx serve -l 127.0.0.1:4511' || true
          sudo ip link del pt0
          exit $status

      # AF_XDP needs root and an interface it may send on: a veth pair.
      - name: AF_XDP on a veth pair (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo ip link add xt0 type veth peer name xt1
          # No IPv6 on the pair: router solicitations and MLD reports sent after
          # link up would show in the tx counters the tests compare.
          sudo sysctl -qw net.ipv6.conf.xt0.disable_ipv6=1 net.ipv6.conf.xt1.disable_ipv6=1
          sudo ip link set xt0 up
          sudo ip link set xt1 up
          bin=$(cargo test -p ferotrx-io --lib --no-run --message-format=json \
                | jq -r 'select(.executable != null and .target.kind == ["lib"]) | .executable')
          sudo FEROTRX_TEST_XDP_IFACE=xt0 "$bin" af_xdp --nocapture --test-threads=1
          cargo build -p ferotrx-cli
          before=$(cat /sys/class/net/xt1/statistics/rx_packets)
          sudo ./target/debug/ferotrx replay examples/web.pcap -i xt0 -B af_xdp --xdp-mode copy -t -l 100
          after=$(cat /sys/class/net/xt1/statistics/rx_packets)
          echo "xt1 received $((after - before)) packets"
          test $((after - before)) -ge 2100

      # Stateful TCP through a real NAT router: a network namespace with the
      # kernel's routing, conntrack and masquerading between two VLANs on a
      # trunk, as in a small lab. Then without VLANs, with 3% packet loss.
      - name: Stateful TCP through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo scripts/tcp-nat-netns.sh ./target/debug/ferotrx -n 300 --cps 100
          sudo NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -n 300 --cps 100

      # The lab router the control server builds (serve --lab, lab.start), as
      # the GUI starts it: the lab examples as they are, through NAT.
      - name: Lab examples through the server's lab router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo BLOCK=1 scripts/lab-examples.sh ./target/debug/ferotrx

      # Several templates mixed by weight, from ten clients to four servers,
      # through the same NAT router: on the trunk, then with 3% loss.
      - name: Multi-flow TCP templates through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo MIX=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx
          sudo MIX=1 NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx

      # The same over IPv6: neighbor discovery between the router and the
      # emulated hosts instead of ARP, one session on the trunk, then the
      # template mix with 3% loss.
      - name: Stateful TCP over IPv6 through a router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo IPV6=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -n 300 --cps 100
          sudo IPV6=1 MIX=1 NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx

      # TCP on a long fat pipe (50 Mbit/s, 80 ms round trip, netem on the
      # router): window scaling must keep more than 64 KB in flight. Then
      # reordering, duplicates and loss both ways, with the template mix.
      # IPv4 and IPv6.
      - name: Stateful TCP on long and impaired paths (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo modprobe sch_netem || true
          sudo BDP=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx
          sudo BDP=1 IPV6=1 NO_VLAN=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx
          impair="delay 5ms reorder 10% 50% duplicate 2% loss 2%"
          sudo NETEM="$impair" LOG_INVALID=1 MIX=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx
          sudo NETEM="$impair" LOG_INVALID=1 IPV6=1 MIX=1 NO_VLAN=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx

      # ECN through a bottleneck that marks instead of dropping (tbf at
      # 20 Mbit/s into fq_codel ecn on the router): every connection agrees
      # on ECN, the router marks and drops nothing, the server slows down
      # without retransmitting. NewReno over IPv4 with VLANs, CUBIC over IPv6
      # without; then Linux (cubic) as the sender to the emulated client.
      - name: TCP congestion control and ECN (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y ethtool
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo modprobe sch_tbf || true
          sudo modprobe sch_fq_codel || true
          sudo ECN=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx
          sudo ECN=1 IPV6=1 NO_VLAN=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx --congestion cubic

      # Stateful UDP through the NAT router: DNS lookups between emulated
      # clients and an emulated server (which dig then asks too), with 3%
      # loss, a mix of DNS, NTP and a timed echo, and over IPv6.
      - name: Stateful UDP and DNS through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo scripts/udp-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 LOSS=0.03 scripts/udp-netns.sh ./target/debug/ferotrx
          sudo MIX=1 scripts/udp-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/udp-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 MIX=1 NO_VLAN=1 LOSS=0.03 scripts/udp-netns.sh ./target/debug/ferotrx

      # SIP calls with RTP through the NAT router: phones that register with
      # digest authentication and call, Opus calls and a busy line between
      # emulated ends; SIPp's caller and registrations (right and wrong
      # password) against the emulated server, and the emulated phones
      # against SIPp's answering end; with 3% loss, over IPv6 and AF_XDP.
      - name: SIP and RTP through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo apt-get install -y ethtool sip-tester
          sudo scripts/sip-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 LOSS=0.03 scripts/sip-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/sip-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 scripts/sip-netns.sh ./target/debug/ferotrx -B af_xdp

      # SMB 2 and 3 through the NAT router: signed 3.1.1 and 2.1 clients that
      # write, read back, list and delete files, an anonymous read-only
      # share and a wrong password between emulated ends; smbclient against
      # the emulated server, and the emulated clients against Samba's smbd;
      # with 3% loss, over IPv6 and AF_XDP.
      - name: SMB through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo apt-get install -y ethtool smbclient samba
          sudo scripts/smb-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 LOSS=0.03 scripts/smb-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/smb-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 scripts/smb-netns.sh ./target/debug/ferotrx -B af_xdp

      # HTTP/3 over QUIC through the NAT router: browser-like connections
      # with a verified certificate, a Retry server with key updates and a
      # refused ALPN between emulated ends; aioquic's client against the
      # emulated server, and the emulated clients against aioquic's server;
      # with 3% loss, over IPv6 and AF_XDP.
      - name: HTTP/3 and QUIC through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo apt-get install -y ethtool openssl python3-aioquic
          sudo scripts/h3-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 LOSS=0.03 scripts/h3-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/h3-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 scripts/h3-netns.sh ./target/debug/ferotrx -B af_xdp

      # Application protocols over stateful TCP through the NAT router: HTTP
      # (keep-alive, chunked, POST, 404) and DNS over TCP between emulated
      # ends, curl against the emulated web server, and the emulated client
      # against a real one (python3 -m http.server); then HTTPS and DNS over
      # TLS (TLS 1.2 and 1.3, client certificates, refused handshakes), curl
      # against the emulated HTTPS server and the emulated client against
      # openssl s_server; MQTT between emulated ends, mosquitto_pub/sub
      # against the emulated broker and the emulated clients against
      # mosquitto; HTTP/2 (h2 and h2c) between emulated ends, curl and h2load
      # against the emulated server and the emulated client against nghttpd;
      # SSH between emulated ends, ssh (and sshpass) against the emulated
      # server and the emulated client against sshd; with 3% loss, over IPv6,
      # and over AF_XDP with two workers.
      - name: Application protocols through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y ethtool curl openssl mosquitto mosquitto-clients nghttp2-client nghttp2-server openssh-client openssh-server sshpass
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo scripts/app-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 LOSS=0.03 scripts/app-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/app-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 scripts/app-netns.sh ./target/debug/ferotrx -B af_xdp --workers 2

      # HTTP/1.1 workloads with response checks through the NAT router:
      # bodies, sizes and headers between emulated ends, a server whose
      # answer must fail one check, and the emulated client checking a real
      # server (python3 -m http.server); with 3% loss, over IPv6, and over
      # AF_XDP with two workers.
      - name: HTTP response checks through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y ethtool
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo scripts/http-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 LOSS=0.03 scripts/http-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/http-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 scripts/http-netns.sh ./target/debug/ferotrx -B af_xdp --workers 2

      # TLS handshake load through the NAT router: new sessions only on
      # three SNI names, a share of resumed ones over TLS 1.3 and 1.2, HTTPS
      # with new sessions; openssl s_time (-new and -reuse) against the
      # emulated server and the emulated client against openssl s_server;
      # with 3% loss, over IPv6, and over AF_XDP with two workers.
      - name: TLS handshake load through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y ethtool openssl
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo scripts/tls-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 LOSS=0.03 scripts/tls-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/tls-netns.sh ./target/debug/ferotrx
          sudo NO_VLAN=1 scripts/tls-netns.sh ./target/debug/ferotrx -B af_xdp --workers 2

      # Host emulation on a bridged LAN with IGMP/MLD snooping: DHCP clients
      # (dnsmasq) that join a group and answer the bridge's queries, a
      # gratuitous ARP, a TCP client with a DHCP address; over IPv6, SLAAC and
      # DHCPv6 hosts, MLD, router advertisements that configure a kernel host,
      # a TCP client with a SLAAC address; a FeroTRX DHCP and DHCPv6 server for
      # busybox udhcpc/udhcpc6 and emulated clients. Then the same over AF_XDP.
      - name: Host emulation on a bridged LAN (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y dnsmasq-base busybox
          cargo build -p ferotrx-cli
          sudo scripts/hosts-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/hosts-netns.sh ./target/debug/ferotrx
          sudo scripts/hosts-netns.sh ./target/debug/ferotrx -B af_xdp
          sudo IPV6=1 scripts/hosts-netns.sh ./target/debug/ferotrx -B af_xdp

      # Stateful TCP and UDP over AF_XDP: the emulated hosts' frames come in
      # through an XDP program and AF_XDP sockets, broadcasts and multicasts
      # (ARP, neighbor discovery) through an AF_PACKET socket. On the VLAN
      # trunk, without VLANs with 3% loss, over IPv6, the template mix, and a
      # higher connection rate.
      - name: Stateful TCP and UDP over AF_XDP (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp -n 300 --cps 100
          sudo NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp -n 300 --cps 100
          sudo IPV6=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp -n 300 --cps 100
          sudo MIX=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp
          sudo NO_VLAN=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp -n 5000 --cps 1000
          sudo scripts/udp-netns.sh ./target/debug/ferotrx -B af_xdp
          sudo IPV6=1 MIX=1 NO_VLAN=1 scripts/udp-netns.sh ./target/debug/ferotrx -B af_xdp

      # One run on several workers (M20). Streams: four AF_XDP sockets on four
      # queues of a veth pair, then four libpcap handles; every packet arrives
      # once. TCP and UDP through the NAT router split by flow: libpcap ports
      # shared by the workers, AF_XDP ports split by queue (QUEUES=4), IPv6,
      # the template mixes, and a stream with latency signatures.
      - name: One run on several workers (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe 8021q || true
          sudo ip link add xw0 numtxqueues 4 numrxqueues 4 type veth peer name xw1 numtxqueues 4 numrxqueues 4
          sudo sysctl -qw net.ipv6.conf.xw0.disable_ipv6=1 net.ipv6.conf.xw1.disable_ipv6=1
          sudo ip link set xw0 up
          sudo ip link set xw1 up
          for backend in "-B af_xdp --xdp-mode copy" "-B pcap"; do
            before=$(cat /sys/class/net/xw1/statistics/rx_packets)
            # shellcheck disable=SC2086
            sudo ./target/debug/ferotrx replay examples/web.pcap -i xw0 $backend -t -l 100 --workers 4
            after=$(cat /sys/class/net/xw1/statistics/rx_packets)
            echo "xw1 received $((after - before)) packets ($backend)"
            test $((after - before)) -ge 2100
          done
          sudo ip link del xw0
          sudo scripts/tcp-nat-netns.sh ./target/debug/ferotrx --workers 4 -n 300 --cps 100
          sudo QUEUES=4 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp --workers 4 -n 2000 --cps 500
          sudo QUEUES=4 NO_VLAN=1 LOSS=0.03 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp --workers 2 -n 300 --cps 100
          sudo QUEUES=2 IPV6=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B af_xdp --workers 2 -n 300 --cps 100
          sudo MIX=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx --workers 3
          sudo scripts/udp-netns.sh ./target/debug/ferotrx --workers 3
          sudo QUEUES=2 IPV6=1 MIX=1 NO_VLAN=1 scripts/udp-netns.sh ./target/debug/ferotrx -B af_xdp --workers 2
          sudo scripts/latency-netns.sh ./target/debug/ferotrx --workers 2

      # Loss and latency through a router in a network namespace: routing and
      # masquerading, a 5 ms delay (netem), then 3% packet loss on top.
      - name: Loss and latency through a router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe sch_netem || true
          sudo scripts/latency-netns.sh ./target/debug/ferotrx
          sudo LOSS=0.03 scripts/latency-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/latency-netns.sh ./target/debug/ferotrx

      # Tunnels with the kernel as the far end: IP in IP, GRE (with key),
      # Ethernet over GRE, VXLAN (also through an encap= rewrite), Geneve,
      # MPLS and 6in4, each stream counted after the kernel unwrapped it;
      # then TCP and DNS inside GTP-U through a router, a TEID per client.
      - name: Tunnels to kernel endpoints and GTP-U (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo apt-get install -y ethtool
          sudo scripts/tunnel-netns.sh ./target/debug/ferotrx

      # The port's own addresses (ARP/neighbor discovery for the router,
      # answers to its pings), multi-burst and next streams, a rate that is a
      # share of the line, and live pause/resume/update through serve.
      - name: Port addresses and live control through a router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo scripts/link-netns.sh ./target/debug/ferotrx
          sudo IPV6=1 scripts/link-netns.sh ./target/debug/ferotrx
          sudo scripts/link-netns.sh ./target/debug/ferotrx -B af_xdp

      # FeroTRX's own impairments, without netem: the two-port bridge
      # between hosts in namespaces, a stream's impairments measured by a
      # receiver, a rate limit; and a TCP run through impaired ports.
      - name: Built-in impairments (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo scripts/impair-netns.sh ./target/debug/ferotrx
          sudo scripts/tcp-nat-netns.sh ./target/debug/ferotrx --impair "delay=5ms loss=2% seed=1" --impair-rx "loss=2% seed=2"

      # RFC 2544 benchmark of a router whose output a token bucket limits to
      # 20 Mbit/s: throughput, latency, frame loss and back-to-back for a
      # fixed size and IMIX, checked against the limit; JSON and text reports.
      - name: Benchmark a rate-limited router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe sch_netem || true
          sudo scripts/bench-netns.sh ./target/debug/ferotrx -q
          # The sweep: warm-up, 3 trials per size, medians and spread, and
          # the Markdown report; two workers pinned to CPUs 0 and 1.
          sudo SWEEP=1 scripts/bench-netns.sh ./target/debug/ferotrx -q --workers 2 --cpus 0-1

      # Y.1564 through a router that polices two services by DSCP (tc police
      # on its ingress): every configuration step and the performance test
      # pass; then with one service's policer below its CIR the test fails,
      # at that service's 100% step.
      - name: Y.1564 service activation through a policing router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo modprobe act_police || true
          sudo modprobe cls_u32 || true
          sudo scripts/y1564-netns.sh ./target/debug/ferotrx -q

      # Three agents (ferotrx serve) in namespaces, driven by `ferotrx fleet
      # run`: deployed, started together, counters added up; then one agent
      # cut off, which must fail. Captures on two agents are collected and
      # merged (read back with tcpdump).
      - name: Fleet of agents started together (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo apt-get install -y tcpdump
          sudo SPREAD=200 scripts/fleet-netns.sh ./target/debug/ferotrx

      # Live captures with BPF filters: to files, ring files, stdout into
      # tcpdump (the way Wireshark reads it), on a remote agent over ctl,
      # next to a run, and `inspect -f`.
      - name: Capture with BPF filters (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo apt-get install -y tcpdump
          sudo scripts/capture-netns.sh ./target/debug/ferotrx

      # Traffic limits of a control server: starts beyond them refused, a
      # top-speed run held to --max-pps on a veth, --max-duration.
      - name: Server traffic limits (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo scripts/limits-netns.sh ./target/debug/ferotrx

      # A regression scenario (examples/scenario-nat.toml) against the NAT
      # router: web and DNS pass, TCP 8080 and NTP are blocked, a voice
      # stream arrives. Then the router resets TCP to port 80, and the second
      # run, compared with the first, must fail and name that check.
      - name: Regression scenario through a NAT router (Linux)
        if: env.CI_SKIP != 'true' && runner.os == 'Linux'
        run: |
          cargo build -p ferotrx-cli
          sudo KEEP="$RUNNER_TEMP/scenario" scripts/scenario-netns.sh ./target/debug/ferotrx

      - name: Scenario reports (Linux)
        if: always() && env.CI_SKIP != 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-reports
          path: ${{ runner.temp }}/scenario
          if-no-files-found: ignore

      # Remembers that this job passed on this tree (scripts/ci-gate.sh).
      # Also after a skip: an equivalent tree passed, so this one counts too.
      - name: Remember that this tree passed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-pass-${{ matrix.os }}-${{ env.CI_TREE }}
          path: ${{ runner.temp }}/ci-pass.txt
          retention-days: 30
          overwrite: true

  # DPDK is an optional feature: build it against Ubuntu's DPDK and send
  # through DPDK's af_packet driver on a veth pair, without hugepages.
  dpdk:
    name: dpdk (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # scripts/ci-gate.sh looks up earlier runs' artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Parents and grandparents too: scripts/ci-gate.sh compares their trees.
          fetch-depth: 3
      # Skips the remaining steps when this job already passed on the same
      # tree, or on one that differs only in docs or version numbers. The
      # job itself still runs, so its required check still reports.
      - name: Skip if an equivalent tree already passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FORCE: ${{ inputs.full == true }}
        run: scripts/ci-gate.sh dpdk
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.CI_SKIP != 'true'
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.CI_SKIP != 'true'
      - name: Install DPDK and libpcap
        if: env.CI_SKIP != 'true'
        run: sudo apt-get update && sudo apt-get install -y dpdk-dev libpcap-dev pkg-config
      - name: Clippy
        if: env.CI_SKIP != 'true'
        run: cargo clippy --workspace --all-targets --features ferotrx-cli/dpdk -- -D warnings
      - name: Build
        if: env.CI_SKIP != 'true'
        run: cargo build -p ferotrx-cli --features dpdk
      - name: Send through DPDK
        if: env.CI_SKIP != 'true'
        run: |
          sudo ip link add dt0 type veth peer name dt1
          # No IPv6 on the pair: router solicitations and MLD reports sent after
          # link up would show in the tx counters the tests compare.
          sudo sysctl -qw net.ipv6.conf.dt0.disable_ipv6=1 net.ipv6.conf.dt1.disable_ipv6=1
          sudo ip link set dt0 up
          sudo ip link set dt1 up
          eal='--no-huge -m 256 --no-pci -l 0 --log-level=warning'
          ./target/debug/ferotrx backends | grep -q '^yes  dpdk'
          before=$(cat /sys/class/net/dt1/statistics/rx_packets)
          sudo ./target/debug/ferotrx replay examples/web.pcap -i net_af_packet0,iface=dt0 \
            -B dpdk --dpdk-args "$eal" -t -l 100
          after=$(cat /sys/class/net/dt1/statistics/rx_packets)
          echo "dt1 received $((after - before)) packets"
          test $((after - before)) -ge 2100
          sudo ./target/debug/ferotrx replay examples/web.pcap -i net_null0 \
            -B dpdk --dpdk-args "$eal" --pps 2000 -l 5
          # Two workers, each on a TX queue of its own, pinned to a CPU each.
          before=$(cat /sys/class/net/dt1/statistics/rx_packets)
          sudo ./target/debug/ferotrx replay examples/web.pcap -i net_af_packet0,iface=dt0,qpairs=2 \
            -B dpdk --dpdk-args "$eal" -t -l 100 --workers 2 --cpus 0-1 2>&1 | tee dpdk-mq.txt
          after=$(cat /sys/class/net/dt1/statistics/rx_packets)
          echo "dt1 received $((after - before)) packets from two queues"
          test $((after - before)) -ge 2100
          grep -q 'queue 1 (2 of 2)' dpdk-mq.txt

      # Stateful TCP and UDP through the NAT router, with DPDK's af_packet
      # driver on the router's links: on the VLAN trunk, then one link per side.
      - name: Stateful TCP and UDP over DPDK
        if: env.CI_SKIP != 'true'
        run: |
          sudo modprobe 8021q || true
          eal='--no-huge -m 512 --no-pci -l 0 --log-level=warning'
          sudo scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B dpdk --dpdk-args "$eal" \
            -i net_af_packet0,iface=t0 -n 300 --cps 100
          sudo NO_VLAN=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B dpdk --dpdk-args "$eal" \
            --client-iface net_af_packet0,iface=c0 --server-iface net_af_packet1,iface=s0 -n 300 --cps 100
          sudo scripts/udp-netns.sh ./target/debug/ferotrx -B dpdk --dpdk-args "$eal" \
            -i net_af_packet0,iface=t0
          # Two workers, each with a TX and an RX queue of its own per port.
          sudo NO_VLAN=1 scripts/tcp-nat-netns.sh ./target/debug/ferotrx -B dpdk --dpdk-args "$eal" \
            --client-iface net_af_packet0,iface=c0,qpairs=2 \
            --server-iface net_af_packet1,iface=s0,qpairs=2 --workers 2 -n 300 --cps 100

      # Remembers that this job passed on this tree (scripts/ci-gate.sh).
      # Also after a skip: an equivalent tree passed, so this one counts too.
      - name: Remember that this tree passed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-pass-dpdk-${{ env.CI_TREE }}
          path: ${{ runner.temp }}/ci-pass.txt
          retention-days: 30
          overwrite: true

  # The dependency tree against RustSec advisories, licenses and sources
  # (deny.toml), and on pull requests the dependencies a change adds against
  # GitHub's advisory database. Not a required check, so a new advisory
  # does not block unrelated merges; it shows red until it is dealt with.
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny --locked check
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
