name: Attest signed Windows packages

# packaging/windows/sign-release.ps1 replaces a release's Windows .zip and
# .msi with signed ones (signed on Jurgen's PC, see docs/windows.md) and
# starts this workflow. Signing changes the files, so the attestations the
# Release workflow made for them no longer match. This checks that the
# programs and the installer carry a valid Authenticode signature and that
# SHA256SUMS matches them, then attests the signed files and SHA256SUMS.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}

jobs:
  check:
    name: Check the signatures
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download and check
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "not a release tag: $env:TAG" }
          gh release download $env:TAG --dir dist --pattern "*-x86_64-windows.zip" --pattern "*-x86_64-windows.msi" --pattern SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "could not download release $env:TAG" }
          $zip = Get-ChildItem dist\*-x86_64-windows.zip
          Expand-Archive $zip.FullName check
          $files = @(Get-ChildItem check -Recurse -Filter *.exe) + @(Get-ChildItem dist\*.msi)
          if ($files.Count -lt 3) { throw "expected ferotrx.exe, ferotrx-gui.exe and the .msi, found $($files.Count) files" }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status), $($s.SignerCertificate.Subject), time stamp: $($null -ne $s.TimeStamperCertificate)"
            if ($s.Status -ne "Valid") { throw "$($f.Name) is not validly signed: $($s.StatusMessage)" }
          }
          $sums = @{}
          foreach ($line in Get-Content dist\SHA256SUMS) {
            if (-not $line.Trim()) { continue }
            $hash, $name = $line -split '\s+', 2
            $sums[$name.TrimStart('*')] = $hash
          }
          foreach ($f in Get-ChildItem dist -Include *.zip, *.msi -Recurse) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            if ($sums[$f.Name] -ne $hash) { throw "SHA256SUMS does not match $($f.Name)" }
          }
          Remove-Item -Recurse check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: dist
      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
