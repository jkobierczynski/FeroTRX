name: Release

# Pushing a version tag (vX.Y.Z) builds the `ferotrx` command line tool for
# Linux, macOS and Windows and publishes a GitHub Release with the packages.
# Pushing the same tag again (moved or recreated) replaces that release.
# Every published file gets a build provenance attestation (who built it,
# from which commit, with which workflow), and the release carries an SBOM
# (CycloneDX) of the Rust programs; see RELEASING.md for checking them.
#
# Pull requests that touch packaging, and manual runs, build the same packages
# as workflow artifacts without publishing anything.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/ferotrx-cli/Cargo.toml
      - crates/ferotrx-gui/Cargo.toml
      - packaging/**
      - python/pyproject.toml
  workflow_dispatch:

# Builds only read the repository; the publish job asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "Workspace version: $version"
          python=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          if [ "$python" != "$version" ]; then
            echo "::error::python/pyproject.toml has version $python, the workspace $version. Bump both."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version (Cargo.toml). Bump the version or fix the tag."
              exit 1
            fi
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$version-dev" >> "$GITHUB_OUTPUT"
          fi

  # Built in Debian 12 so the binary and the .deb run on Debian 12 and newer
  # and Ubuntu 22.04 and newer (glibc 2.36, libpcap0.8).
  linux:
    name: Linux x86_64 (.deb, .tar.gz)
    needs: version
    runs-on: ubuntu-latest
    container: debian:bookworm
    env:
      NAME: ferotrx-${{ needs.version.outputs.name }}-x86_64-linux
    steps:
      - name: Install build tools and libpcap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential pkg-config libpcap-dev dpkg-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo build --release --locked -p ferotrx-cli -p ferotrx-gui
      - name: Smoke test
        run: |
          ./target/release/ferotrx-gui --version
          ./target/release/ferotrx --version
          ./target/release/ferotrx backends
          ./target/release/ferotrx info examples/web.pcap
      - name: Debian package
        run: |
          cargo deb -p ferotrx-cli --no-build --output dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          # Install it like a user would, and run it.
          apt-get install -y ./dist/*.deb
          ferotrx --version
      - name: Archive
        run: |
          mkdir -p "$NAME"
          cp target/release/ferotrx target/release/ferotrx-gui README.md LICENSE "$NAME/"
          cp -r examples docs "$NAME/"
          tar czf "dist/$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # One runner builds both: Apple silicon natively, Intel by cross-compiling
  # against the same SDK (libpcap ships with macOS).
  macos:
    name: macOS ${{ matrix.arch }} (.tar.gz)
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    env:
      NAME: ferotrx-${{ needs.version.outputs.name }}-${{ matrix.arch }}-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p ferotrx-cli -p ferotrx-gui --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.arch == 'aarch64'
        run: |
          ./target/${{ matrix.target }}/release/ferotrx --version
          ./target/${{ matrix.target }}/release/ferotrx info examples/web.pcap
      - name: Archive
        run: |
          mkdir -p dist "$NAME"
          cp target/${{ matrix.target }}/release/ferotrx target/${{ matrix.target }}/release/ferotrx-gui README.md LICENSE "$NAME/"
          cp -r examples docs "$NAME/"
          tar czf "dist/$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Links against the Npcap SDK; sending on interfaces needs Npcap installed
  # (wpcap.dll is loaded late, so the programs start without it).
  windows:
    name: Windows x86_64 (.msi, .zip)
    needs: version
    runs-on: windows-latest
    env:
      NAME: ferotrx-${{ needs.version.outputs.name }}-x86_64-windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$PWD\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        run: cargo build --release --locked -p ferotrx-cli -p ferotrx-gui
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, $env:NAME | Out-Null
          Copy-Item target\release\ferotrx.exe, target\release\ferotrx-gui.exe, README.md, LICENSE $env:NAME
          Copy-Item -Recurse examples, docs $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "dist\$env:NAME.zip"
      - name: Installer
        shell: pwsh
        run: packaging\windows\build-msi.ps1 -BinDir target\release -Out dist -Name $env:NAME
      # Releases are signed afterwards on Jurgen's PC (sign-release.ps1, with a
      # cloud certificate that needs a code from a phone). Here the script runs
      # against this build with a throwaway certificate, without uploading.
      - name: Signing script (throwaway certificate)
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=FeroTRX CI test" -CertStoreLocation Cert:\CurrentUser\My
          $root = [Security.Cryptography.X509Certificates.X509Store]::new("Root", "LocalMachine")
          $root.Open("ReadWrite"); $root.Add($cert); $root.Close()
          packaging\windows\sign-release.ps1 -From dist -NoUpload -Thumbprint $cert.Thumbprint -Out signed
          foreach ($f in Get-ChildItem signed -Include *.msi, *.zip -Recurse) { Write-Host $f.Name }
          Expand-Archive (Get-ChildItem signed\*.zip).FullName signed\check
          foreach ($f in @(Get-ChildItem signed\check -Recurse -Filter *.exe) + @(Get-ChildItem signed\*.msi)) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status), $($s.SignerCertificate.Subject), time stamp: $($null -ne $s.TimeStamperCertificate)"
            if ($s.Status -ne "Valid") { throw "$($f.Name) is not validly signed" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # The Python client: a pure-Python wheel and the source archive.
  python:
    name: Python client (.whl, .tar.gz)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build python --outdir dist
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  # A software bill of materials: every crate (with version, license and
  # checksum) in the `ferotrx` and `ferotrx-gui` programs, for all targets.
  sbom:
    name: SBOM (CycloneDX)
    needs: version
    runs-on: ubuntu-latest
    env:
      NAME: ferotrx-${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: SBOM
        run: |
          cargo cyclonedx --format json --all-features --target all
          mkdir -p dist
          for crate in ferotrx-cli ferotrx-gui; do
            bom=$(find "crates/$crate" -maxdepth 1 -name '*.cdx.json' | head -n 1)
            if [ -z "$bom" ]; then
              echo "::error::cargo cyclonedx wrote no SBOM for $crate"
              exit 1
            fi
            cp "$bom" "dist/$NAME-$crate.cdx.json"
          done
          python3 -c 'import json, sys; [print(f, len(json.load(open(f))["components"]), "components") for f in sys.argv[1:]]' dist/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, linux, macos, windows, python, sbom]
    runs-on: ubuntu-latest
    # contents: write creates the release; id-token and attestations sign
    # the provenance with the workflow's identity (Sigstore) and store it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Two pushes of the same tag must not publish at the same time.
    concurrency:
      group: release-${{ github.ref_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        run: |
          # A tag that was moved or recreated replaces its release: delete the
          # old one (the tag stays) so no stale packages or notes remain.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing it."
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "FeroTRX $TAG" \
            --generate-notes
