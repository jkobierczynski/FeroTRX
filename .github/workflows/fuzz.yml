name: Fuzz

# The fuzz targets in fuzz/ (cargo-fuzz, libFuzzer, nightly). On pull
# requests, each target whose code changed runs for 60 s; every night all
# of them run for 10 minutes. Not a required check: a crash shows here and
# its input is kept as an artifact (see fuzz/README.md for what to do with it).
on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"
      targets:
        description: Targets (blank for all)
        default: ""

# A new push to a pull request cancels the fuzzing still going for the old one.
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz

      - name: Fuzz the changed parsers (60 s each)
        if: github.event_name == 'pull_request'
        run: fuzz/run.sh --seconds 60 --changed "origin/${{ github.base_ref }}"
      - name: Fuzz every target (10 min each)
        if: github.event_name == 'schedule'
        run: fuzz/run.sh --seconds 600
      - name: Fuzz (by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds }}
          TARGETS: ${{ inputs.targets }}
        # TARGETS is split into words on purpose: target names.
        run: fuzz/run.sh --seconds "$SECONDS_PER_TARGET" $TARGETS

      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
