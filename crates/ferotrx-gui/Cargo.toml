[package]
name = "ferotrx-gui"
description = "FeroTRX desktop GUI: ports, stream and packet editor, live stats, over the control API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# egui 0.36 needs Rust 1.95; the libraries and the CLI stay on the workspace MSRV.
rust-version = "1.95"

[[bin]]
name = "ferotrx-gui"
path = "src/main.rs"

[dependencies]
ferotrx-ctl.workspace = true
ferotrx-packet.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
ferotrx-core.workspace = true
clap.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence"] }
egui_extras = "0.36"
# Checks a font file before egui (which stops on a bad one) loads it.
skrifa = "0.44"
egui_plot = "0.37"
egui-file-dialog = { version = "0.16", default-features = false }
ron = "0.12"
# The user's folders: %APPDATA% and Documents on Windows (eframe uses it too).
directories = "6"
# The token of a server the GUI starts itself.
ring.workspace = true

# Explorer's file dialogs, attaching to the console --help prints to, and
# starting a local server as administrator (Npcap for administrators only).
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
ferotrx-io.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Icon, version information and manifest in ferotrx-gui.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
ferotrx-ctl = { workspace = true }
