[package]
name = "ferotrx-gui"
description = "FeroTRX desktop GUI: ports, stream and packet editor, live stats, over the control API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferotrx-gui"
path = "src/main.rs"

[dependencies]
ferotrx-ctl.workspace = true
ferotrx-packet.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
ferotrx-core.workspace = true
clap.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence"] }
egui_extras = "0.33"
egui_plot = "0.34"
egui-file-dialog = { version = "0.12", default-features = false }
ron = "0.11"

# Explorer's file dialogs, and attaching to the console --help prints to.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Icon, version information and manifest in ferotrx-gui.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
ferotrx-ctl = { workspace = true }
