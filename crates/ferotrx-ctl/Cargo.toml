[package]
name = "ferotrx-ctl"
description = "Remote control API for FeroTRX: load profiles, start and stop runs, live stats over JSON-RPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["pcap"]
# Let runs send on real network interfaces (libpcap/Npcap).
pcap = ["ferotrx-io/pcap"]

[dependencies]
ferotrx-core.workspace = true
ferotrx-io.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
