[package]
name = "ferotrx-ctl"
description = "Remote control API for FeroTRX: load profiles, start and stop runs, live stats over JSON-RPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["pcap", "af-xdp"]
# Let runs send on real network interfaces (libpcap/Npcap).
pcap = ["ferotrx-io/pcap"]
# Let runs send through Linux AF_XDP sockets.
af-xdp = ["ferotrx-io/af-xdp"]
# Let runs send through DPDK (needs DPDK installed to build).
dpdk = ["ferotrx-io/dpdk"]

[dependencies]
ferotrx-core.workspace = true
ferotrx-io.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
ring.workspace = true
base64.workspace = true
rcgen.workspace = true
