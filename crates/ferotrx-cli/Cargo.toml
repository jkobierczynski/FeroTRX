[package]
name = "ferotrx-cli"
description = "FeroTRX command line traffic replay tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferotrx"
path = "src/main.rs"

[features]
default = ["pcap", "af-xdp"]
pcap = ["ferotrx-io/pcap", "ferotrx-ctl/pcap"]
af-xdp = ["ferotrx-io/af-xdp", "ferotrx-ctl/af-xdp"]
dpdk = ["ferotrx-io/dpdk", "ferotrx-ctl/dpdk"]

[dependencies]
ferotrx-core.workspace = true
ferotrx-io.workspace = true
ferotrx-packet.workspace = true
ferotrx-ctl.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true

# `ferotrx service`: the control server as a Windows service.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

# Icon, version information and manifest in ferotrx.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `cargo deb -p ferotrx-cli` builds the Debian package the release workflow
# publishes. Dependencies come from the binary's linked libraries (libpcap).
[package.metadata.deb]
name = "ferotrx"
maintainer = "Jurgen Kobierczynski <jkobierczynski@users.noreply.github.com>"
copyright = "FeroTRX contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
FeroTRX replays pcap and pcapng captures at a controlled rate, rewrites them \
on the way, varies fields from packet to packet, builds packets from scratch, \
runs several streams at once from a profile, shapes them over time \
(Poisson arrivals, bursts, ramps), replays TCP sessions \
statefully, plays stateful UDP transactions, measures loss and latency on the \
receive side, benchmarks devices the RFC 2544 way (throughput, latency, frame \
loss, back-to-back, IMIX), runs regression scenarios with JUnit reports and \
checks profile files. Sends through libpcap or AF_XDP."""
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/ferotrx", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/ferotrx/README.md", "644"],
    ["../../examples/*", "usr/share/doc/ferotrx/examples/", "644"],
    ["../../docs/*", "usr/share/doc/ferotrx/docs/", "644"],
]
