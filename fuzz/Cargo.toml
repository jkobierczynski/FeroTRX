# Fuzz targets for cargo-fuzz (libFuzzer). Not part of the workspace: it
# needs a nightly toolchain. See fuzz/README.md.
[package]
name = "ferotrx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferotrx-core = { path = "../crates/ferotrx-core", features = ["fuzzing"] }
# Without libpcap and AF_XDP: the fuzzing controllers open no interfaces.
ferotrx-ctl = { path = "../crates/ferotrx-ctl", default-features = false, features = ["fuzzing"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "app"
path = "fuzz_targets/app.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_engine"
path = "fuzz_targets/tcp_engine.rs"
test = false
doc = false
bench = false

