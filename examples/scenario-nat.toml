# A scenario: regression checks for a NAT router between a client LAN and a
# server LAN. What must get through, what must be blocked, and how well
# traffic flows. Run it before and after a change to the router:
#
#   sudo ferotrx scenario run examples/scenario-nat.toml --history runs/ --junit nat.xml
#   ... change the firewall ...
#   sudo ferotrx scenario run examples/scenario-nat.toml --history runs/ --baseline last
#
# The second run fails when a check that passed before fails now, and shows
# what changed. scripts/scenario-netns.sh builds this router in network
# namespaces and does exactly that.
#
# For a lab with VLANs on one trunk: --set client_iface=enp0s3
# --set server_iface=enp0s3, and add `vlan = 10` / `vlan = 20` to the hosts.

name = "nat-router"
description = "NAT router: web and DNS pass, 8080 and NTP are blocked, a voice stream flows"
# A busy VM can stall for a moment; run a failing check once more before
# calling it failed.
attempts = 2

[vars]
client_iface = "c0"
server_iface = "s0"
client_net = "192.168.10"
server_net = "192.168.20"
# The router's MAC on the client side, where the voice stream is sent to.
router_mac = "02:00:00:00:01:01"

# Every HTTP connection of examples/http.pcap completes through the NAT,
# byte for byte.
[[check]]
name = "web through NAT"
require = ["cps > 10", "timed_out == 0"]
[check.tcp]
pcap = "http.pcap"
connections = 50
cps = 50
concurrency = 20
[check.tcp.client]
iface = "${client_iface}"
ip = "${client_net}.100/24"
ips = 10
gateway = "${client_net}.1"
[check.tcp.server]
iface = "${server_iface}"
ip = "${server_net}.80/24"
gateway = "${server_net}.1"
[check.tcp.tcp]
# Give up on a connection after two SYN retransmissions (1.75 s), so a
# router that drops the traffic fails the check in seconds, not minutes.
syn_retries = 2

# The firewall drops TCP to port 8080: no handshake completes.
[[check]]
name = "port 8080 blocked"
expect = "blocked"
duration = "3s"
[check.tcp]
port = 8080
connections = 3
[[check.tcp.message]]
from = "client"
text = "GET / HTTP/1.0\r\n\r\n"
[[check.tcp.message]]
from = "server"
text = "HTTP/1.0 200 OK\r\n\r\n"
[check.tcp.client]
iface = "${client_iface}"
ip = "${client_net}.100/24"
gateway = "${client_net}.1"
[check.tcp.server]
iface = "${server_iface}"
ip = "${server_net}.80/24"
gateway = "${server_net}.1"

# DNS lookups through the NAT: every one answered as expected, quickly.
[[check]]
name = "DNS through NAT"
require = ["response_avg < 100ms"]
[check.udp]
transactions = 100
rate = 100
queries = ["www.lab.local A", "www.lab.local AAAA", "lab.local MX", "missing.lab.local A NXDOMAIN"]
records = ["www.lab.local CNAME web.lab.local", "web.lab.local A ${server_net}.80",
           "web.lab.local AAAA fd00:20::80", "lab.local MX 10 mail.lab.local"]
[check.udp.client]
iface = "${client_iface}"
ip = "${client_net}.100/24"
ips = 10
gateway = "${client_net}.1"
[check.udp.server]
iface = "${server_iface}"
ip = "${server_net}.53/24"
gateway = "${server_net}.1"
[check.udp.udp]
timeout = "300ms"
retries = 5

# The firewall drops NTP: no answer.
[[check]]
name = "NTP blocked"
expect = "blocked"
duration = "3s"
[check.udp]
app = "ntp"
transactions = 3
[check.udp.client]
iface = "${client_iface}"
ip = "${client_net}.100/24"
gateway = "${client_net}.1"
[check.udp.server]
iface = "${server_iface}"
ip = "${server_net}.123/24"
gateway = "${server_net}.1"
[check.udp.udp]
timeout = "500ms"
retries = 1

# A voice-like stream (1000 packets per second, DSCP EF) through the NAT,
# received on the server side as ${server_net}.2: little loss, low latency.
# The thresholds leave room for a jittery VM.
[[check]]
name = "voice stream"
iface = "${client_iface}"
rx = "${server_iface}"
duration = "3s"
require = ["loss_pct < 2%", "latency_avg < 50ms", "rx_mbps > 1Mbit/s"]
[check.traffic]
[[check.traffic.stream]]
name = "voice"
packet = "eth(src=02:00:00:00:01:02,dst=${router_mac})/ipv4(src=${client_net}.2,dst=${server_net}.2,dscp=46)/udp(sport=4000,dport=5004)/raw(len=160)"
rate = "1000pps"
loops = 0
