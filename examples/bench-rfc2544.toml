# An RFC 2544 benchmark of a device between two interfaces of this machine:
#
#   sudo ferotrx bench examples/bench-rfc2544.toml -i eth1 --rx eth2 --report bench.json
#
# FeroTRX sends on eth1 to the device, which routes (or switches) the frames
# to eth2, where they are received and counted. Every frame carries a 28-byte
# signature (flow, sequence number, send time) at the end of its payload.
# Writes bench.json and bench.txt. See docs/benchmarking.md.

[benchmark]
# The frames: addressed to the device's MAC on the sending side (here a router
# at 02:00:00:00:01:01 between 10.9.1.0/24 and 10.9.2.0/24). The payload is
# cut or padded to each size.
packet = "eth(src=02:00:00:00:01:02,dst=02:00:00:00:01:01)/ipv4(src=10.9.1.2,dst=10.9.2.2)/udp(sport=4000,dport=9000)"
# Many flows rather than one, so the device spreads them over its queues.
vary = ["port_src=4000..4255"]

tests = ["throughput", "latency", "frame_loss", "back_to_back"]
# Frame sizes without the 4-byte FCS: "rfc2544" is 60, 124, 252, 508, 1020,
# 1276 and 1514 (64 to 1518 bytes on the wire); "imix" is 60:7, 590:4, 1514:1.
# A 60-byte UDP/IPv4 frame has no room for the signature and is sent as 70.
sizes = ["rfc2544", "imix"]
line_rate = "1gbps"

trial_duration = "10s"     # RFC 2544 asks for at least 60s for the final runs
warmup = "2s"              # learning frames, so the device knows the addresses
repetitions = 1
loss_threshold = 0.0       # percent
resolution = 0.5           # percent of the line rate
burst_max = 100000
max_time = "2h"

[output]
backend = "pcap"           # af_xdp for rates libpcap cannot reach
