# Tunnels on the lab router (`sudo ferotrx lab up`): the same small web
# session (web.pcap) carried four ways. The outer headers go from VLAN 10
# through the router to its stream receiver, 192.168.20.2, which sends the
# frames back on VLAN 20; the router only sees the outer addresses.
#
#   sudo ferotrx run examples/lab-tunnels.toml -i ftrx-lab --rx ftrx-lab -d 10s
#   ferotrx inspect web.pcap -r 'encap=eth/ipv4(src=192.168.10.40,dst=192.168.20.2)/udp/vxlan(vni=100)' -c 1
#
# Rewrites and `vary` change the innermost headers (the phones' addresses in
# GTP-U, the VM's in VXLAN); `outer_ip_src`, `teid`, `vni`, `gre_key` and
# `mpls` vary the tunnel itself. Latency signatures sit at the end of the
# innermost payload, so --rx measures through the tunnel as well.
# See docs/replay.md#tunnels.
format = 1

# VXLAN: whole Ethernet frames of 50 tenants, one VNI each, 20 frames apart.
[[stream]]
name = "vxlan"
pcap = "web.pcap"
rate = "500pps"
loops = 0
latency = true
rewrite = ["encap=eth(src=02:00:00:00:10:40,dst=02:00:00:00:00:01)/vlan(id=10)/ipv4(src=192.168.10.40,dst=192.168.20.2)/udp/vxlan(vni=100)"]
vary = ["vni=100..149,every=20"]

# GTP-U from a base station: one TEID per phone, with a QoS flow (PDU
# session container, uplink); the phones' addresses are the inner sources.
[[stream]]
name = "gtp-u"
pcap = "web.pcap"
rate = "500pps"
loops = 0
latency = true
rewrite = [
  "ip_src=172.16.0.100",
  "encap=eth(src=02:00:00:00:10:41,dst=02:00:00:00:00:01)/vlan(id=10)/ipv4(src=192.168.10.41,dst=192.168.20.2)/udp/gtpu(teid=1000,qfi=9,pdu=ul)",
]
vary = ["ip_src=172.16.0.100..172.16.0.149,every=21", "teid=1000..1049,every=21"]

# GRE with a key per site, from 8 site routers (outer sources).
[[stream]]
name = "gre"
pcap = "web.pcap"
rate = "500pps"
loops = 0
latency = true
rewrite = ["encap=eth(src=02:00:00:00:10:42,dst=02:00:00:00:00:01)/vlan(id=10)/ipv4(src=192.168.10.42,dst=192.168.20.2)/gre(key=1)"]
vary = ["outer_ip_src=192.168.10.42..192.168.10.49,every=21", "gre_key=1..8,every=21"]

# Two MPLS labels on top of the frame, as an LSR would see it. The lab
# router does not do MPLS: this one is for the receiver's capture (or your
# MPLS lab), so it goes to the receiver's MAC on VLAN 20 directly.
[[stream]]
name = "mpls"
pcap = "web.pcap"
rate = "100pps"
loops = 0
rewrite = ["mac_dst=02:00:00:00:00:02", "vlan_push=20", "mpls_push=100", "mpls_push=200:5"]
