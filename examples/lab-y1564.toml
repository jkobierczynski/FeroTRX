# A short Y.1564 service activation test of the lab router (`sudo ferotrx
# lab up`): two services through the router to its stream receiver,
# 192.168.20.2, which sends the frames back on VLAN 20.
#
#   sudo ferotrx y1564 examples/lab-y1564.toml -i ftrx-lab --rx ftrx-lab --report y1564.json
#
# The lab router does not police, so the policing steps fail ("not
# policed": more than CIR + EIR got through) and the others pass; break it with
# `ferotrx lab up --loss 0.01` to see the frame loss ratio fail, or `--delay
# 30ms` for the transfer delay. Steps of 3 s instead of Y.1564's 60, and a
# 15 s performance test instead of 15 minutes, to try it quickly; see
# examples/y1564.toml for a full one and docs/y1564.md.
format = 1

[y1564]
line_rate = "100mbps"           # a veth link has none of its own
tests = ["configuration", "performance"]
steps = [25, 50, 75, 100]       # percent of the CIR
step_duration = "3s"
performance_duration = "15s"
interval = "1s"

[[service]]
name = "voice"
packet = "eth(src=02:00:00:00:10:06,dst=02:00:00:00:00:01)/vlan(id=10)/ipv4(src=192.168.10.6,dst=192.168.20.2,dscp=46)/udp(sport=5004,dport=5004)"
sizes = 252
cir = "2mbps"
flr = 0.1                       # percent
ftd = "20ms"
fdv = "10ms"
availability = 99.0

[[service]]
name = "data"
packet = "eth(src=02:00:00:00:10:07,dst=02:00:00:00:00:01)/vlan(id=10)/ipv4(src=192.168.10.7,dst=192.168.20.2,dscp=10)/udp(sport=4000,dport=9000)"
# Frames above the CIR, marked so a color-aware policer can tell them apart.
yellow_packet = "eth(src=02:00:00:00:10:07,dst=02:00:00:00:00:01)/vlan(id=10)/ipv4(src=192.168.10.7,dst=192.168.20.2,dscp=12)/udp(sport=4000,dport=9000)"
vary = ["port_src=4000..4015"]
sizes = "emix:abceg"
cir = "10mbps"
eir = "5mbps"
flr = 0.5
ftd = "50ms"
fdv = "20ms"
availability = 99.0
