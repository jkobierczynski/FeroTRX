# A short RFC 2544 throughput test for fleet-kinds.toml, over the agent's
# cable l0 - l1 (see examples/bench-rfc2544.toml for a real one).
format = 1

[benchmark]
packet = "eth(src=02:00:00:00:66:01,dst=02:00:00:00:66:02)/ipv4(src=10.96.0.1,dst=10.96.0.2)/udp(sport=4000,dport=9000)"
tests = ["throughput"]
sizes = [508]
line_rate = "20mbps"
trial_duration = "1s"
resolution = 10
repetitions = 1
